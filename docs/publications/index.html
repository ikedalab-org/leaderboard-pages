<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="池田研究室の研究成果">
  <title>Publications | Ikeda Laboratory</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --surface: #f6f8fa;
      --text: #1f2328;
      --subtext: #59636e;
      --border: #d0d7de;
      --accent: #0969da;
      --link-background: #ddf4ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0d1117;
        --surface: #161b22;
        --text: #e6edf3;
        --subtext: #9198a1;
        --border: #30363d;
        --accent: #58a6ff;
        --link-background: #122d42;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", "Hiragino Kaku Gothic ProN",
        "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.75;
    }

    a {
      color: var(--accent);
    }

    .container {
      width: min(100% - 32px, 960px);
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .description {
      margin: 0;
      color: var(--subtext);
      font-size: 1.05rem;
    }

    .summary {
      margin-top: 14px;
      color: var(--subtext);
      font-size: 0.9rem;
    }

    .year-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 36px;
    }

    .year-nav a {
      display: inline-block;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }

    .year-section {
      margin: 0 0 48px;
      scroll-margin-top: 20px;
    }

    .year-section > h2 {
      margin: 0 0 22px;
      font-size: 2rem;
      line-height: 1.2;
    }

    .category {
      margin: 0 0 30px;
    }

    .category h3 {
      margin: 0 0 12px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--border);
      font-size: 1.15rem;
    }

    .publication-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .publication {
      margin-bottom: 10px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    .citation {
      overflow-wrap: anywhere;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .links a {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--link-background);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .empty {
      padding: 24px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--subtext);
      text-align: center;
    }

    footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--subtext);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Publications</h1>
      <p class="description">池田研究室の研究成果</p>
      <div class="summary">
        0 publications ・ Updated 2026-08-05 20:26 JST
      </div>
    </header>
    <div class="empty">現在、掲載準備中です。</div>
    <footer>
      Ikeda Laboratory
    </footer>
  </main>
</body>
</html>
